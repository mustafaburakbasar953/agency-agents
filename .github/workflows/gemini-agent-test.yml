name: Gemini Agent Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Görev / prompt"
        required: true
        default: "Kendini kısaca tanıt ve bir AI yazılım ekibinde hangi görevleri üstlenebileceğini açıkla."

permissions:
  contents: read

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise SystemExit("GEMINI_API_KEY secret bulunamadı.")

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
          payload = {
              "contents": [{
                  "parts": [{"text": os.environ["USER_PROMPT"]}]
              }]
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Gemini API HTTP {error.code}: {details}")

          parts = result.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          answer = "\n".join(part.get("text", "") for part in parts if "text" in part)
          if not answer:
              raise SystemExit("Gemini yanıt döndürmedi: " + json.dumps(result, ensure_ascii=False))
          print("\n===== GEMINI YANITI =====\n")
          print(answer)
          PY
