name: Gemini Agent Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Görev / prompt"
        required: true
        default: "Kendini kısaca tanıt ve bir AI yazılım ekibinde hangi görevleri üstlenebileceğini açıkla."

permissions:
  contents: read

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise SystemExit("GEMINI_API_KEY secret bulunamadı.")

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
          payload = {
              "contents": [{
                  "parts": [{"text": os.environ["USER_PROMPT"]}]
              }]
          }
          data = json.dumps(payload).encode("utf-8")
          last_error = None

          for attempt in range(1, 4):
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                      raise SystemExit(f"Gemini API HTTP {error.code}: {details}")
                  last_error = f"HTTP {error.code}: {details}"
              except (TimeoutError, urllib.error.URLError) as error:
                  if attempt == 3:
                      raise SystemExit(f"Gemini API bağlantı hatası: {error}")
                  last_error = str(error)

              wait_seconds = attempt * 10
              print(f"Geçici API/bağlantı sorunu: {last_error}. {wait_seconds} saniye sonra tekrar denenecek.")
              time.sleep(wait_seconds)
          else:
              raise SystemExit(f"Gemini API yanıt vermedi: {last_error}")

          parts = result.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          answer = "\\n".join(part.get("text", "") for part in parts if "text" in part)
          if not answer:
              raise SystemExit("Gemini yanıt döndürmedi: " + json.dumps(result, ensure_ascii=False))
          print("\\n===== GEMINI YANITI =====\\n")
          print(answer)
          PY
